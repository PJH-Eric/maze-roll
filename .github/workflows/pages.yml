name: Deploy front end to GitHub Pages
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.d.outputs.page_url }}' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "26.12.1" }
      - name: 規則與房間測試
        run: npm ci && npm test
      - name: 注入前端公開設定（伺服器與 GA4）
        run: sed -i "s#__GAME_SERVER_URL__#${GAME_SERVER_URL}#; s#__GA4_MEASUREMENT_ID__#${GA4_MEASUREMENT_ID}#" public/js/config.js
        env: { GAME_SERVER_URL: '${{ vars.GAME_SERVER_URL }}', GA4_MEASUREMENT_ID: '${{ vars.GA4_MEASUREMENT_ID }}' }
      - uses: actions/configure-pages@v5
      - name: 產生搜尋引擎中繼資料與爬蟲檔案
        run: node scripts/inject-seo.js
      - uses: actions/upload-pages-artifact@v3
        with: { path: public }
      - id: d
        uses: actions/deploy-pages@v4
